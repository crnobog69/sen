name: Docker slika
on:
  push:
    tags:
      - '[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9][0-9]_*'
      - '[0-9][0-9]-[0-9][0-9]-[0-9][0-9][0-9][0-9]_*'
      - 'v*'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: linux_amd64
    env:
      IMAGE: 100.91.132.35:5000/vltc/sen
      DOCKER_BUILD_SUMMARY: 'false'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          github-server-url: http://100.91.132.35:5000
          persist-credentials: false

      - name: Oznaka slike
        id: release
        env:
          REF: ${{ gitea.ref }}
        run: |
          case "$REF" in
            refs/tags/*) tag=${REF#refs/tags/} ;;
            *) tag=$(TZ=Europe/Belgrade date +'%d.%m.%Y_%H-%M-%S') ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@v3
        with:
          cache-binary: false
          buildkitd-config-inline: |
            [registry."100.91.132.35:5000"]
              http = true
      - name: Prijava na Gitcrn
        if: gitea.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: 100.91.132.35:5000
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ gitea.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.release.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=http://100.91.132.35:5000/${{ gitea.repository }}
            org.opencontainers.image.revision=${{ gitea.sha }}
