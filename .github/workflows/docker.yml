name: Docker slika

on:
  push:
    tags:
      - '[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9][0-9]_*'
      - '[0-9][0-9]-[0-9][0-9]-[0-9][0-9][0-9][0-9]_*'
      - 'v*'
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  docker:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/crnobog69/sen
    steps:
      - uses: actions/checkout@v4

      - name: Oznaka slike
        id: release
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/*) tag=${REF#refs/tags/} ;;
            *) tag=$(TZ=Europe/Belgrade date +'%d.%m.%Y_%H-%M-%S') ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Prijava na GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.release.outputs.tag }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
